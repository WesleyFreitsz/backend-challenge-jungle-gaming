<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Jungle Gaming — Wagering Tester</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
      <div>
        <h1 class="text-xl font-black text-amber-400">🦧 Jungle Wagering Playground</h1>
        <p class="text-xs text-slate-400">Ambiente de teste rápido de transações, concorrência e ledger</p>
      </div>
      <div class="text-right">
        <span class="text-xs text-slate-400">Saldo Atual</span>
        <div id="display-balance" class="text-2xl font-bold text-emerald-400">R$ 0,00</div>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- Coluna 1: Carteira & Controles -->
      <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
        <h2 class="font-bold text-slate-200 border-b border-slate-700 pb-2">1. Carteira</h2>

        <div>
          <label class="text-xs text-slate-400">Player ID</label>
          <input id="playerId" type="text" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm" value="player-demo-01" />
        </div>

        <div>
          <label class="text-xs text-slate-400">Wallet ID</label>
          <input id="walletId" type="text" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm" placeholder="Criar ou colar ID" />
        </div>

        <button onclick="createWallet()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded text-sm transition">
          Criar Nova Carteira (R$ 100,00)
        </button>

        <div class="pt-4 border-t border-slate-700 space-y-2">
          <h2 class="font-bold text-slate-200 text-sm">Auditoria & Integridade</h2>
          <button onclick="reconcileWallet()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-1.5 rounded text-xs transition">
            Reconciliar Livro-Razão (Ledger)
          </button>
          <button onclick="fetchLedger()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-1.5 rounded text-xs transition">
            Atualizar Extrato
          </button>
        </div>
      </section>

      <!-- Coluna 2: Jogo / Ações de Aposta -->
      <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4 flex flex-col justify-between">
        <div>
          <h2 class="font-bold text-slate-200 border-b border-slate-700 pb-2">2. Fortune Chimp 🎰</h2>

          <!-- Slot Reel Visual -->
          <div class="my-4 p-6 bg-slate-950 rounded-xl border border-slate-700 text-center">
            <div id="slot-symbols" class="text-5xl tracking-widest animate-pulse">🍌 🦧 💎</div>
            <div id="game-status" class="mt-2 text-xs font-semibold text-slate-400">Faça sua aposta</div>
          </div>

          <div class="space-y-3">
            <div>
              <label class="text-xs text-slate-400">Valor da Aposta (BRL)</label>
              <input id="betAmount" type="text" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm font-bold text-emerald-400" value="25.00" />
            </div>

            <button onclick="playRound()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg text-base shadow-lg transition">
              Girar / Apostar 🎲
            </button>
          </div>
        </div>

        <!-- Botões de Teste de Casos Extremos -->
        <div class="pt-4 border-t border-slate-700 space-y-2">
          <label class="text-xs text-slate-400 font-semibold uppercase">Testes de Borda</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="triggerRefundLastBet()" class="bg-purple-600 hover:bg-purple-500 text-white py-1.5 rounded text-xs font-semibold">
              Reembolsar Última Bet
            </button>
            <button onclick="triggerSpamConcurrentBets()" class="bg-rose-700 hover:bg-rose-600 text-white py-1.5 rounded text-xs font-semibold">
              Spam 10x Bets (Race)
            </button>
          </div>
        </div>
      </section>

      <!-- Coluna 3: Logs & Extrato do Ledger -->
      <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col h-[520px]">
        <h2 class="font-bold text-slate-200 border-b border-slate-700 pb-2 mb-2">3. Livro-Razão & Logs</h2>
        
        <div class="flex-1 overflow-y-auto space-y-2 pr-1 font-mono text-xs" id="ledger-list">
          <p class="text-slate-500 italic text-center py-4">Nenhum evento registrado ainda.</p>
        </div>

        <div class="mt-3 pt-2 border-t border-slate-700">
          <div class="text-[11px] text-slate-400 truncate" id="last-tx-ref">Última Ref: -</div>
        </div>
      </section>

    </div>
  </div>

  <script>
    const API = 'http://localhost:3000';
    let lastBetExternalId = null;

    function getWalletId() {
      return document.getElementById('walletId').value.trim();
    }
    function getPlayerId() {
      return document.getElementById('playerId').value.trim();
    }

    async function createWallet() {
      const playerId = getPlayerId() || `player-${Math.floor(Math.random() * 10000)}`;
      document.getElementById('playerId').value = playerId;

      try {
        const res = await fetch(`${API}/wallets`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            playerId,
            initialBalance: { amount: '100.00', currency: 'BRL' }
          })
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('walletId').value = data.id;
          updateBalanceDisplay(data.balance.amount);
          fetchLedger();
          logEntry('WALLET', `Carteira criada: ${data.id} (+R$ 100.00)`);
        } else {
          alert(`Erro: ${data.message}`);
        }
      } catch (err) {
        alert('Erro ao conectar com o backend NestJS.');
      }
    }

    async function playRound() {
      const walletId = getWalletId();
      if (!walletId) return alert('Crie ou selecione uma carteira primeiro!');

      const amount = document.getElementById('betAmount').value.trim();
      const roundId = `round-${Date.now()}`;
      const extTxId = `tx-bet-${Date.now()}`;
      lastBetExternalId = extTxId;
      document.getElementById('last-tx-ref').innerText = `Última Bet: ${extTxId}`;

      document.getElementById('slot-symbols').innerText = '🔄 🔄 🔄';
      document.getElementById('game-status').innerText = 'Processando aposta...';

      // 1. Enviar BET
      const betRes = await sendWagerTx({
        kind: 'BET',
        externalTransactionId: extTxId,
        roundId,
        amount
      });

      if (betRes.status === 'REJECTED') {
        document.getElementById('slot-symbols').innerText = '❌ ❌ ❌';
        document.getElementById('game-status').innerText = `Rejeitado: ${betRes.failureCode}`;
        logEntry('REJECTED', `BET falhou: ${betRes.failureCode}`);
        return;
      }

      updateBalanceDisplay(betRes.balance.amount);
      logEntry('BET', `Débito de -R$ ${amount} efetuado`);

      // 2. Simular Resultado (50% de chance de WIN)
      const won = Math.random() > 0.5;
      setTimeout(async () => {
        if (won) {
          const winAmount = (parseFloat(amount) * 2).toFixed(2);
          const winTxId = `tx-win-${Date.now()}`;
          document.getElementById('slot-symbols').innerText = '🦧 🦧 🦧';
          document.getElementById('game-status').innerText = `GANHOU! +R$ ${winAmount}`;

          const winRes = await sendWagerTx({
            kind: 'WIN',
            externalTransactionId: winTxId,
            roundId,
            amount: winAmount,
            referenceExternalTransactionId: extTxId
          });
          updateBalanceDisplay(winRes.balance.amount);
          logEntry('WIN', `Prêmio de +R$ ${winAmount} creditado!`);
        } else {
          document.getElementById('slot-symbols').innerText = '🍌 💩 🍌';
          document.getElementById('game-status').innerText = 'Não foi dessa vez (LOSS)';

          await sendWagerTx({
            kind: 'LOSS',
            externalTransactionId: `tx-loss-${Date.now()}`,
            roundId,
            amount: '0.00'
          });
          logEntry('LOSS', 'Rodada finalizada como LOSS');
        }
        fetchLedger();
      }, 500);
    }

    async function triggerRefundLastBet() {
      if (!lastBetExternalId) return alert('Nenhuma BET foi feita ainda nesta sessão.');
      const amount = document.getElementById('betAmount').value.trim();

      const res = await sendWagerTx({
        kind: 'REFUND',
        externalTransactionId: `tx-refund-${Date.now()}`,
        roundId: 'manual-refund',
        amount,
        referenceExternalTransactionId: lastBetExternalId
      });

      if (res.status === 'PROCESSED') {
        updateBalanceDisplay(res.balance.amount);
        logEntry('REFUND', `Reembolso de R$ ${amount} concluído com sucesso!`);
      } else {
        logEntry('REJECTED', `Erro ao reembolsar: ${res.failureCode || 'Erro desconhecido'}`);
      }
      fetchLedger();
    }

    async function triggerSpamConcurrentBets() {
      const walletId = getWalletId();
      if (!walletId) return alert('Crie uma carteira primeiro.');

      logEntry('CONCURRENCY', 'Disparando 10 apostas simultâneas de R$ 20,00...');
      const promises = Array.from({ length: 10 }).map((_, i) =>
        sendWagerTx({
          kind: 'BET',
          externalTransactionId: `spam-tx-${Date.now()}-${i}`,
          roundId: `spam-round-${Date.now()}-${i}`,
          amount: '20.00'
        })
      );

      const results = await Promise.all(promises);
      const passed = results.filter(r => r.status === 'PROCESSED').length;
      const rejected = results.filter(r => r.status === 'REJECTED').length;

      logEntry('CONCURRENCY', `Resultado do Spam: ${passed} Aceitas | ${rejected} Rejeitadas (Saldo protegido)`);
      fetchLedger();
      if (results[0]?.balance) updateBalanceDisplay(results[0].balance.amount);
    }

    async function sendWagerTx({ kind, externalTransactionId, roundId, amount, referenceExternalTransactionId }) {
      const walletId = getWalletId();
      const playerId = getPlayerId();
      const idempotencyKey = `provider-ui:${externalTransactionId}`;

      const res = await fetch(`${API}/wagering/transactions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Idempotency-Key': idempotencyKey
        },
        body: JSON.stringify({
          providerId: 'provider-ui',
          externalTransactionId,
          playerId,
          walletId,
          roundId,
          gameId: 'fortune-chimp',
          kind,
          money: { amount, currency: 'BRL' },
          referenceExternalTransactionId
        })
      });
      return await res.json();
    }

    async function reconcileWallet() {
      const walletId = getWalletId();
      if (!walletId) return alert('Informe o Wallet ID.');

      const res = await fetch(`${API}/wallets/${walletId}/reconciliation`, { method: 'POST' });
      const data = await res.json();
      if (res.ok) {
        alert(
          `Reconciliação:\n` +
          `- Saldo Armazenado: R$ ${data.storedBalance.amount}\n` +
          `- Saldo Calculado pelo Ledger: R$ ${data.calculatedBalance.amount}\n` +
          `- Diferença: R$ ${data.difference.amount}\n` +
          `- Consistente: ${data.consistent ? 'SIM ✅' : 'NÃO ❌'}\n` +
          `- Lançamentos auditados: ${data.checkedEntries}`
        );
      }
    }

    async function fetchLedger() {
      const walletId = getWalletId();
      if (!walletId) return;

      const res = await fetch(`${API}/wallets/${walletId}/ledger?limit=20`);
      if (!res.ok) return;
      const data = await res.json();

      const container = document.getElementById('ledger-list');
      container.innerHTML = '';

      if (data.entries.length === 0) {
        container.innerHTML = '<p class="text-slate-500 italic text-center py-4">Sem entradas no ledger.</p>';
        return;
      }

      data.entries.forEach(e => {
        const isCredit = e.direction === 'CREDIT';
        const el = document.createElement('div');
        el.className = `p-2 rounded bg-slate-900 border-l-4 ${isCredit ? 'border-emerald-500' : 'border-rose-500'} flex justify-between items-center`;
        el.innerHTML = `
          <div>
            <div class="font-bold ${isCredit ? 'text-emerald-400' : 'text-rose-400'}">${e.direction} R$ ${e.amount}</div>
            <div class="text-[10px] text-slate-500">${e.transactionId.substring(0, 18)}...</div>
          </div>
          <div class="text-right">
            <div class="text-slate-300 font-semibold">R$ ${e.balanceAfter}</div>
            <div class="text-[10px] text-slate-500">${new Date(e.createdAt).toLocaleTimeString()}</div>
          </div>
        `;
        container.appendChild(el);
      });
    }

    function updateBalanceDisplay(amount) {
      document.getElementById('display-balance').innerText = `R$ ${parseFloat(amount).toFixed(2)}`;
    }

    function logEntry(tag, text) {
      console.log(`[${tag}] ${text}`);
    }
  </script>
</body>
</html>
